name: Package

on:
  workflow_dispatch:        # the "Run workflow" button
  release:
    types: [published]      # publishing a release attaches the zips to it

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-15          # Apple Silicon (M1 and later)
            platform: mac-apple-silicon
          - os: macos-15-intel    # Intel Macs
            platform: mac-intel
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Build jar
        run: |
          mvn -B clean package
          VERSION=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout | tr -d '\r')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p target/jpkg-input
          cp "target/bnbattlesandbox-$VERSION.jar" target/jpkg-input/

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          jpackage --type app-image --name BattleNationsBattleSandbox --app-version "$VERSION" \
            --input target/jpkg-input --main-jar "bnbattlesandbox-$VERSION.jar" \
            --main-class hero.roland.bnsim.Main \
            --add-modules java.base,java.desktop,java.logging \
            --jlink-options "--strip-debug --no-man-pages --no-header-files" \
            --app-content packaging/README.txt,LICENSE,THIRD_PARTY_NOTICES.md,licenses \
            --dest target/dist

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/dist/BattleNationsBattleSandbox -DestinationPath "BattleNationsBattleSandbox-$env:VERSION-windows.zip"

      - name: Package and zip (Mac)
        if: runner.os == 'macOS'
        run: |
          jpackage --type app-image --name BattleNationsBattleSandbox --app-version "$VERSION" \
            --input target/jpkg-input --main-jar "bnbattlesandbox-$VERSION.jar" \
            --main-class hero.roland.bnsim.Main \
            --add-modules java.base,java.desktop,java.logging \
            --jlink-options "--strip-debug --no-man-pages --no-header-files" \
            --dest target/dist
          APP=target/dist/BattleNationsBattleSandbox.app
          # Apple Silicon refuses to run unsigned apps; an ad-hoc signature is enough.
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep "$APP"
          STAGE="BattleNationsBattleSandbox-$VERSION-${{ matrix.platform }}"
          mkdir "$STAGE"
          mv "$APP" "$STAGE/"
          cp -R packaging/README.txt LICENSE THIRD_PARTY_NOTICES.md licenses "$STAGE/"
          # ditto keeps the launcher's executable bit, which a plain upload would lose.
          ditto -c -k --keepParent "$STAGE" "$STAGE.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: BattleNationsBattleSandbox-${{ matrix.platform }}
          path: BattleNationsBattleSandbox-*.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: BattleNationsBattleSandbox-*.zip
